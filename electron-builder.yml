appId: com.unofun.app
productName: UnoFun
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - "!node_modules/**/*"
asar: true
